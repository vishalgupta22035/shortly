spring.application.name=shortly
server.port=8080
spring.mongodb.uri=mongodb://localhost:27017/shortly_db

shortly.base-urspring.application.name=shortly
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shortly}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Shortly Configuration
shortly.base-url=http://localhost:8080